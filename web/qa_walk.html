<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Walking network check</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    html, body, #map { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
    #panel { position: absolute; z-index: 1000; top: 10px; right: 10px; width: 280px; background: #fff;
             padding: 12px; border-radius: 6px; box-shadow: 0 1px 6px rgba(0,0,0,.3); font-size: 13px; line-height: 1.5; }
    #panel h1 { font-size: 15px; margin: 0 0 6px; }
    .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
    button { margin-top: 6px; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>Walking network check</h1>
    <div id="msg">Loading...</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Open through a local server (fetch does not work from file://):
    //   python3 -m http.server 8000      (run in the project folder)
    //   then open http://localhost:8000/web/qa_walk.html
    const map = L.map("map").setView([33.4185, -111.929], 15);
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);

    const msg = document.getElementById("msg");
    const WALK_SPEED = 1.34;  // same as pipeline/network.py
    let matrix, snaps, entrances, names = {}, markers = {}, centroid = {}, selected = null, overlay = L.layerGroup().addTo(map);

    // where an entrance comes from, in the order pipeline/entrances.py tries them
    const SOURCES = {
      manual:       { color: "#7c3aed", label: "checked by hand" },
      osm_main:     { color: "#000",    label: "OSM door (main)" },
      osm_entrance: { color: "#000",    label: "OSM door" },
      asu:          { color: "#0891b2", label: "ASU entrance point" },
      asu_outline:  { color: "#fff",    label: "ASU outline, point closest to a path (a guess)" },
      outline:      { color: "#d1d5db", label: "OSM outline, point closest to a path (a guess)" },
      centroid:     { color: "#dc2626", label: "no outline found, building point" },
    };
    const start = id => [entrances[id].lat, entrances[id].lon];
    const minutes = s => (s / 60).toFixed(1) + " min";
    const meters = (a, b) => map.distance(a, b);

    function colorFrom(a) {
      for (const [id, m] of Object.entries(markers)) {
        const t = matrix[a][id];
        const c = id === a ? "#1d4ed8" : t === undefined ? "#000" : t <= 300 ? "#16a34a" : t <= 600 ? "#eab308" : t <= 900 ? "#f97316" : "#9ca3af";
        m.setStyle({ fillColor: c });
      }
    }

    function reset() {
      selected = null; overlay.clearLayers();
      for (const [id, m] of Object.entries(markers)) m.setStyle({ fillColor: snaps[id].snap_m > 100 ? "#dc2626" : "#6b7280" });
      msg.innerHTML = `Click a building to start.<br>
        <span class="dot" style="background:#dc2626"></span>building point more than 100 m from a path<br>
        Small dots are entrances: <span class="dot" style="background:#7c3aed"></span>by hand
        <span class="dot" style="background:#000"></span>OSM door <span class="dot" style="background:#0891b2"></span>ASU point
        <span class="dot" style="background:#fff;border:1px solid #000"></span>ASU outline <span class="dot" style="background:#d1d5db;border:1px solid #000"></span>OSM outline
        <span class="dot" style="background:#dc2626"></span>none (hover a dot to see)<br>
        Click a second building to see the walking time.`;
    }

    function pick(id) {
      if (!selected) {
        selected = id; colorFrom(id);
        msg.innerHTML = `<b>${id}</b> ${names[id]}<br>Click a second building.<br>
          <span class="dot" style="background:#16a34a"></span>up to 5 min
          <span class="dot" style="background:#eab308"></span>10
          <span class="dot" style="background:#f97316"></span>15
          <span class="dot" style="background:#9ca3af"></span>more<br><button id="clr">Reset</button>`;
        document.getElementById("clr").onclick = reset;
        return;
      }
      const a = selected, t = matrix[a][id];
      overlay.clearLayers();
      const line = L.polyline([centroid[a], start(a), [snaps[a].lat, snaps[a].lon], [snaps[id].lat, snaps[id].lon], start(id), centroid[id]],
                              { color: "#1d4ed8", weight: 2, dashArray: "4 6" }).addTo(overlay);
      const straight = meters(centroid[a], centroid[id]);
      msg.innerHTML = `<b>${a}</b> ${names[a]}<br>to <b>${id}</b> ${names[id]}<br><br>
        Walking time: <b>${t === undefined ? "not reachable" : minutes(t)}</b><br>
        Straight line: ${straight.toFixed(0)} m (${minutes(straight / WALK_SPEED)} if walking straight)<br>
        ${t === undefined ? "" : `Walking distance: ~${(t * WALK_SPEED).toFixed(0)} m, ratio ${(t * WALK_SPEED / Math.max(straight, 1)).toFixed(2)}`}<br>
        Entrance: ${entrances[a].source} / ${entrances[id].source}<br>
        Entrance to path: ${snaps[a].snap_m} m / ${snaps[id].snap_m} m<br>
        <button id="clr">Reset</button>`;
      document.getElementById("clr").onclick = reset;
      selected = null;
      colorFrom(a);
    }

    Promise.all([
      fetch("../data/walk_matrix.json").then(r => r.json()),
      fetch("../data/building_snaps.json").then(r => r.json()),
      fetch("../data/walk_network.geojson").then(r => r.json()),
      fetch("../data/buildings.geojson").then(r => r.json()),
      fetch("../data/building_entrances.json").then(r => r.json()),
    ]).then(([m, s, net, b, ent]) => {
      matrix = m; snaps = s; entrances = ent;
      L.geoJSON(net, { style: { color: "#2563eb", weight: 1.5, opacity: .7 } }).addTo(map);
      for (const f of b.features) {
        const id = f.properties.building_id, [lon, lat] = f.geometry.coordinates;
        names[id] = f.properties.name; centroid[id] = [lat, lon];
        markers[id] = L.circleMarker([lat, lon], { radius: 5, color: "#fff", weight: 1, fillOpacity: .9 })
          .bindTooltip(`${id}: ${f.properties.name}`).on("click", () => pick(id)).addTo(map);
      }
      // entrance used for walking, colored by where it comes from (see SOURCES)
      for (const [id, e] of Object.entries(entrances)) {
        L.circleMarker([e.lat, e.lon], { radius: 3, color: "#000", weight: 1, fillColor: (SOURCES[e.source] || SOURCES.centroid).color, fillOpacity: 1, interactive: false })
          .bindTooltip(`${id} entrance: ${(SOURCES[e.source] || SOURCES.centroid).label}`).addTo(map);
      }
      reset();
    }).catch(err => { msg.textContent = "Could not load the data files. Open this page through a local server (see the comment in the file). " + err; });
  </script>
</body>
</html>
