<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ASU Events Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside>
      <header>
        <h1>ASU Events</h1>
        <p id="sub"></p>
      </header>
      <div class="filters">
        <input type="search" id="q" placeholder="Search events or buildings">
        <div class="row" id="when"></div>
        <div class="row cats" id="cats"></div>
        <button class="link" id="morecats">Show all categories</button>
      </div>
      <div id="list"></div>
    </aside>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <!-- event data, rewritten every time test_WebGIS.py runs -->
  <script src="events_data.js"></script>
  <script src="map.js"></script>
</body>
</html>
